<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:;" />
<title>ZOVEX</title>
<style>
  :root { --brand: #F01228; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif; user-select: none; }
  .card {
    position: absolute; inset: 10px; border-radius: 20px;
    background: radial-gradient(120% 100% at 50% 0%, #1b2130 0%, #0d1016 55%, #07090f 100%);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 24px 70px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  }
  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: 20px; pointer-events: none;
    background: radial-gradient(60% 45% at 50% 22%, rgba(240,18,40,.18), transparent 70%);
  }
  .mark { width: 92px; height: 92px; display: grid; place-items: center;
    border-radius: 24px; background: linear-gradient(145deg, #1d2432, #10141d);
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 12px 34px rgba(240,18,40,.22), inset 0 1px 0 rgba(255,255,255,.07);
    animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
  .mark svg { width: 52px; height: 52px; }
  .word { font-size: 26px; font-weight: 800; letter-spacing: .34em; color: #f2f4f8;
    padding-inline-start: .34em; animation: rise .7s .08s cubic-bezier(.2,.7,.3,1) both; }
  .tag { margin-top: -12px; font-size: 12.5px; color: #8b93a6; letter-spacing: .02em;
    animation: rise .7s .16s cubic-bezier(.2,.7,.3,1) both; }
  .bar { width: 172px; height: 3px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 99px;
    background: linear-gradient(90deg, transparent, #FF5A68, var(--brand), transparent);
    animation: slide 1.15s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(340%); } }
  @keyframes rise { from { opacity: 0; transform: translateY(9px) scale(.97); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .mark, .word, .tag { animation: none; } .bar i { animation-duration: 2.4s; } }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg viewBox="0 0 1024 1024" aria-hidden="true">
        <defs><linearGradient id="g" x1="0.1" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#FF5A68"/><stop offset="0.45" stop-color="#F01228"/><stop offset="1" stop-color="#A3000F"/>
        </linearGradient></defs>
        <path d="M268 292 H760 V382 L430 638 H760 V732 H264 V642 L594 386 H268 Z" fill="url(#g)"/>
      </svg>
    </div>
    <div class="word">ZOVEX</div>
    <div class="tag">טוען את הספרייה…</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
